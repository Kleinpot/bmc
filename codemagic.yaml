workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      groups:
        - supabase_group
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: |
          SUPABASE_URL="${SUPABASE_URL:-https://acihoqulcvgsibgmvrfj.supabase.co}"
          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-sb_publishable_IL5f8sscSAFX4R4mEpGo8A_zx95WKIM}"
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
